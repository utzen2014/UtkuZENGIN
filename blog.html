<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utku Zengin - Blog Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background: #f4f7f6; color: #333; }
        h1, h2 { color: #2c3e50; }
        .form-card, .post-card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 1em; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219150; }
        .post-date { color: #7f8c8d; font-size: 0.85em; margin-bottom: 10px; }
        #status { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>📝 Utku Zengin - Blog</h1>

    <!-- BLOG YAZI EKLEME FORMU -->
    <div class="form-card">
        <h2>✨ Yeni Blog Yazısı Ekle</h2>
        <input type="text" id="postTitle" placeholder="Yazı Başlığı..." />
        <textarea id="postContent" rows="6" placeholder="Yazı içeriğini buraya yazın..."></textarea>
        <button onclick="publishPost()">🚀 Yayınla (Herkes Görsün)</button>
        <p id="status"></p>
    </div>

    <hr>

    <h2>📚 Tüm Blog Yazıları</h2>
    <div id="postsContainer">Yazılar yükleniyor...</div>

    <script>
        const REPO_OWNER = "utzen2014";
        const REPO_NAME = "UtkuZENGIN";

        // 1. SİTEDEKİ TÜM YAZILARI ÇEKME (HERKESE AÇIK)
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts`);
                if (!res.ok) {
                    container.innerHTML = "<p>Henüz yayınlanmış bir yazı yok.</p>";
                    return;
                }
                const files = await res.json();
                container.innerHTML = "";

                for (const file of files.reverse()) {
                    if (file.name.endsWith('.json')) {
                        const postRes = await fetch(file.download_url);
                        const postData = await postRes.json();

                        const card = document.createElement('div');
                        card.className = 'post-card';
                        card.innerHTML = `
                            <h3>${postData.title}</h3>
                            <div class="post-date">📅 ${postData.date}</div>
                            <p>${postData.content.replace(/\n/g, '<br>')}</p>
                        `;
                        container.appendChild(card);
                    }
                }
            } catch (err) {
                container.innerHTML = "<p>Yazılar yüklenirken bir hata oluştu.</p>";
            }
        }

        // 2. YAZI YAYINLAMA (Sadece token sahibi yapabilir)
        async function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const status = document.getElementById('status');

            if (!title || !content) {
                alert("Lütfen hem başlık hem de içerik girin!");
                return;
            }

            // Token hafızada yoksa kullanıcıya sor
            let token = localStorage.getItem('gh_blog_token');
            if (!token) {
                token = prompt("Blog yayınlamak için GitHub Personal Access Token'ınızı girin:");
                if (!token) return;
                localStorage.setItem('gh_blog_token', token); // Tekrar sormamak için tarayıcıya kaydeder
            }

            status.style.color = "blue";
            status.innerText = "Yazı GitHub'a kaydediliyor...";

            const fileName = `post-${Date.now()}.json`;
            const filePath = `posts/${fileName}`;

            const postData = {
                title: title,
                content: content,
                date: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR')
            };

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(postData))));

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Yeni blog yazısı: ${title}`,
                        content: contentEncoded
                    })
                });

                if (response.ok) {
                    status.style.color = "green";
                    status.innerText = "✅ Yazı başarıyla yayınlandı!";
                    document.getElementById('postTitle').value = "";
                    document.getElementById('postContent').value = "";
                    setTimeout(() => {
                        status.innerText = "";
                        loadPosts();
                    }, 2000);
                } else {
                    localStorage.removeItem('gh_blog_token'); // Yanlışsa temizle
                    status.style.color = "red";
                    status.innerText = "❌ Hata oluştu! Token geçersiz olabilir.";
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "❌ Bağlantı hatası oluştu.";
            }
        }

        loadPosts();
    </script>
</body>
</html>
